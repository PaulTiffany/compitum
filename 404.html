<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found — Compitum</title>
  <meta http-equiv="refresh" content="10; url=/" />
  <script>
    (function() {
      try {
        var href = window.location.pathname || '';
        // Redirect .md doc links to corresponding .html pages
        if (href.endsWith('.md')) {
          var target = href.replace(/\.md$/, '.html');
          window.location.replace(target + window.location.search + window.location.hash);
        }
      } catch (e) {}
    })();
  </script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; color: #1b1f23; }
    .wrap { max-width: 720px; margin: 10vh auto; text-align: center; }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    p { margin: 0.5rem 0; }
    a.btn { display: inline-block; margin-top: 1rem; padding: 0.6rem 1rem; background: #0969da; color: #fff; text-decoration: none; border-radius: 6px; }
    .hint { color: #57606a; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main class="wrap" role="main" aria-labelledby="nf-title">
    <h1 id="nf-title">Page not found</h1>
    <p>The page you’re looking for doesn’t exist or has moved.</p>
    <p class="hint">You’ll be redirected to the home page shortly.</p>
    <p><a class="btn" href="/" aria-label="Go to home page">Go to Home</a></p>
  </main>
</body>
</html>
