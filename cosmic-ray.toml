[cosmic-ray]
module = "compitum"
module-path = "src"
# Use a POSIX shell script on Linux runners; Windows has .cmd equivalent
test-command = "bash scripts/cr_pytest.sh"
timeout = 60.0
coverage-file = ".coverage"

excluded-modules = [
    "tests/*",
    "**/__init__.py",
    "routerbench.*",
]

[cosmic-ray.distributor]
name = "local"

