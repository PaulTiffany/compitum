[cosmic-ray]
module = "compitum"
module-path = "src"
# Windows-friendly test command (no bash required)
test-command = "scripts\\cr_pytest.cmd"
# Allow time per mutant for Windows
timeout = 180.0
coverage-file = ".coverage"

excluded-modules = [
    "tests/*",
    "**/__init__.py",
    "routerbench.*",
]

[cosmic-ray.distributor]
name = "local"