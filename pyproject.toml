[project]
name = "compitum"
version = "0.2.0"
description = "compitum: A Production-Ready, Geometrically-Aware AI Router"
authors = [{ name="compitum authors", email="dev@compitum.org" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
 "numpy>=1.24",
 "scipy>=1.10",
 "scikit-learn>=1.3",
 "pydantic>=2.7",
 "pyyaml>=6.0.1",
 "pandas>=2.0" # Added for data manipulation in various scripts and tests
]

[project.optional-dependencies]
dev = [
 "pytest>=8.0",
 "hypothesis>=6.98",
 "jsonschema>=4.0",
 "pytest-cov>=5.0",
 "ruff>=0.5.0",
 "mypy>=1.10",
 "lightgbm>=4.3 ; python_version < '3.13'",
 "types-PyYAML",
 "cosmic-ray>=8,<9", # CLI/config format verified against 8.x (init/baseline/exec/dump, TOML schema)
 "bandit",
 "pytest-benchmark",
 "build"
]
materials = ["mp_api>=0.44"]

[project.urls]
Homepage = "https://github.com/PaulTiffany/compitum"
Documentation = "https://paultiffany.github.io/compitum/"
Repository = "https://github.com/PaulTiffany/compitum"
Issues = "https://github.com/PaulTiffany/compitum/issues"

[project.scripts]
compitum = "compitum.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["compitum*"]
exclude = ["routerbench*"]

[tool.setuptools.package-data]
compitum = ["py.typed"]

# --------------------------- 
# Ruff
# --------------------------- 
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
  "src/routerbench",
  "docs",
  "data",
  "notebooks",
  "benchmarks",
  "tools/analysis",
  "tools/legacy",
  "tools/reporting",
  "tools/ablation_zero_delay_vs_delayed.py",
  "tools/evaluate_compitum.py",
  "tools/generate_release_attestation.py",
  "tools/generate_routerbench_report.py",
  ".venv*",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["I001", "E501", "E702", "F401", "F841", "E402", "E741", "W291"]
"tools/**" = ["E501", "I001"]
"scripts/**" = ["E501", "I001", "E702", "F401", "F841"]
"examples/**" = ["E501", "I001", "E702", "F541"]


# --------------------------- 
# MyPy
# --------------------------- 

[tool.mypy]
packages = ["compitum"]
exclude = [
  "^src/routerbench/"
]

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "sklearn.*", "yaml.*", "lightgbm.*", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["routerbench.*"]
ignore_errors = true


# ---------------------------
# PyTest
# ---------------------------
# This is the single source of truth for pytest config. A stray root-level
# pytest.ini used to silently shadow this whole table (pytest prefers pytest.ini
# over pyproject.toml when both exist) -- confirmed via pytest's own startup
# warning and by reproducing CI's exact invocation with no coverage collected
# at all despite fail_under=100 below. Deleted pytest.ini and folded its
# (more complete) marker list in here instead of the other way around, since
# --cov is deliberately NOT in addopts: several CI jobs run narrow test-path
# subsets (e.g. `pytest -q tests/invariants`) that were never meant to satisfy
# whole-package coverage, and baking --cov into global addopts would silently
# break those. Jobs that want the 100% gate pass --cov explicitly (see ci.yml,
# rigor.yml).
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "-m", "not routerbench and not examples and not heavy_bench"]
markers = [
  "hypo_lifecycle: marks tests as part of the hypothesis lifecycle suite",
  "invariants: property-based and structural invariants",
  "lg: learning/geometry-focused invariants",
  "cl: explainability/determinism invariants",
  "sy: control/stability invariants",
  "stat: estimation/uncertainty invariants",
  "pedagogy: pedagogy/\"control of error\" behavior",
  "deep: longer-running profile for nightly builds",
  "examples: runnable examples (excluded by default)",
  "routerbench: RouterBench integration tests (optional)",
  "benchmark: performance micro/meso benchmarks (pytest-benchmark)",
  "heavy_bench: long-running performance diagnostics (opt-in)",
]
python_functions = ["test_*", "benchmark_*"]

# --------------------------- 
# Coverage
# --------------------------- 
[tool.coverage.run]
branch = true
source = ["src/compitum", "src/routerbench"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.bandit]
skips = ["B101", "B301", "B403", "B112"]

# --------------------------- 
# Mutmut (optional mutation testing)
# --------------------------- 
[tool.mutmut]
paths_to_mutate = ["src/compitum"]
tests_dir = ["tests"]
use_coverage = true
backup = false
