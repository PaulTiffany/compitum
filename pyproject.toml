[project]
name = "compitum"
version = "0.1.1"
description = "compitum: A Production-Ready, Geometrically-Aware AI Router"
authors = [{ name="compitum authors", email="dev@compitum.org" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
 "numpy>=1.24",
 "scipy>=1.10",
 "scikit-learn>=1.3",
 "pydantic>=2.7",
 "pyyaml>=6.0.1",
 "pandas>=2.0" # Added for data manipulation in various scripts and tests
]

[project.optional-dependencies]
dev = [
 "pytest>=8.0",
 "hypothesis>=6.98",
 "jsonschema>=4.0",
 "pytest-cov>=5.0",
 "ruff>=0.5.0",
 "mypy>=1.10",
 "lightgbm>=4.3 ; python_version < '3.13'",
 "types-PyYAML",
 "cosmic-ray",
 "bandit",
 "pytest-benchmark",
 "build"
]

[project.urls]
Homepage = "https://github.com/PaulTiffany/compitum"
Documentation = "https://paultiffany.github.io/compitum/"
Repository = "https://github.com/PaulTiffany/compitum"
Issues = "https://github.com/PaulTiffany/compitum/issues"

[project.scripts]
compitum = "compitum.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["compitum*"]
exclude = ["routerbench*"]

[tool.setuptools.package-data]
compitum = ["py.typed"]

# --------------------------- 
# Ruff
# --------------------------- 
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
  "src/routerbench",
  "docs",
  "data",
  "tools",
  "benchmarks",
  ".venv*",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["I001", "E501", "E702", "F401", "F841", "E402", "E741", "W291"]
"tools/**" = ["E501"]
"scripts/**" = ["E501", "I001", "E702", "F401", "F841"]
"examples/**" = ["E501", "I001", "E702", "F541"]


# --------------------------- 
# MyPy
# --------------------------- 

[tool.mypy]
packages = ["compitum"]
exclude = [
  "^src/routerbench/"
]

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "sklearn.*", "yaml.*", "lightgbm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["routerbench.*"]
ignore_errors = true


# --------------------------- 
# PyTest
# --------------------------- 
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--cov=compitum",
  "--cov-branch",
  "--cov-report=term-missing",
  "-q",
  "-m",
  "not routerbench"
]
markers = [
  "invariants: tests for core system invariants",
  "routerbench: RouterBench integration tests (optional)"
]

# --------------------------- 
# Coverage
# --------------------------- 
[tool.coverage.run]
branch = true
source = ["src/compitum", "src/routerbench"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.bandit]
skips = ["B101", "B301", "B403", "B112"]

# --------------------------- 
# Mutmut (optional mutation testing)
# --------------------------- 
[tool.mutmut]
paths_to_mutate = ["src/compitum"]
tests_dir = ["tests"]
use_coverage = false
backup = false

