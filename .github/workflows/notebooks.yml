name: Notebooks

on:
  pull_request:
    paths:
      - 'notebooks/**'
      - '.github/workflows/notebooks.yml'
      - 'pyproject.toml'
      - 'README.md'
  push:
    branches: [ main ]
    paths:
      - 'notebooks/**'
      - '.github/workflows/notebooks.yml'

jobs:
  execute:
    name: Execute notebooks (nbmake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run nbmake on notebooks
        run: |
          pytest --nbmake -q notebooks
        env:
          PYTHONUNBUFFERED: "1"
