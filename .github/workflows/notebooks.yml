name: Notebooks

on:
  pull_request:
    paths:
      - 'notebooks/**'
      - '.github/workflows/notebooks.yml'
      - 'pyproject.toml'
      - 'README.md'
  push:
    branches: [ main ]
    paths:
      - 'notebooks/**'
      - '.github/workflows/notebooks.yml'

jobs:
  execute:
    name: Execute notebooks (nbmake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps for notebooks
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest nbmake jupyter ipykernel
      - name: Run nbmake on notebooks
        shell: bash
        run: |
          set -euo pipefail
          # Curated allowlist to keep CI green and reliable.
          CURATED=(
            notebooks/Getting_Started.ipynb
            notebooks/Examples_Tour.ipynb
            notebooks/Integration_Snippets.ipynb
          )
          echo "Executing curated notebooks with nbmake:" "${CURATED[@]}"
          pytest --nbmake -q "${CURATED[@]}"
        env:
          PYTHONUNBUFFERED: "1"
