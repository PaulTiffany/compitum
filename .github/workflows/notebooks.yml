name: Notebooks

on:
  pull_request:
    paths:
      - 'notebooks/**'
      - '.github/workflows/notebooks.yml'
      - 'pyproject.toml'
      - 'README.md'
  push:
    branches: [ main ]
    paths:
      - 'notebooks/**'
      - '.github/workflows/notebooks.yml'

jobs:
  execute:
    name: Execute notebooks (nbmake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps for notebooks
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest nbmake jupyter ipykernel
      - name: Run nbmake on notebooks
        shell: bash
        run: |
          shopt -s nullglob || true
          set +e
          files=(notebooks/*.ipynb)
          if [ ${#files[@]} -gt 0 ]; then
            echo "Found ${#files[@]} notebooks. Executing with nbmake..."
            pytest --nbmake -q notebooks
          else
            echo "No notebooks found; skipping execution."
          fi
        env:
          PYTHONUNBUFFERED: "1"
