name: Docs

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -e .

      - name: Text hygiene (mojibake check)
        run: |
          python tools/check_mojibake.py

      - name: Link check
        run: sphinx-build -W -b linkcheck docs docs_build/linkcheck

      - name: Build Sphinx HTML (nitpicky)
        run: |
          sphinx-build -n -W -b html docs docs_build/html

      - name: Build LLM snapshot (Paleae)
        run: |
          git clone --depth 1 https://github.com/PaulTiffany/paleae.git "$RUNNER_TEMP/paleae"
          python tools/build_llm_context_pack.py --paleae-path "$RUNNER_TEMP/paleae/paleae.py" --out docs/repo_snapshot.jsonl --format jsonl --target-size 1MB

      - name: Assemble site (hero index + docs under /docs)
        run: |
          set -euo pipefail
          mkdir -p site_out
          mkdir -p site_out/docs
          # Provide docs under /docs for stable navigation
          cp -R docs_build/html/* site_out/docs/
          # Overwrite root index with hero landing page and include assets
          cp index.html site_out/index.html
          if [ -d assets ]; then cp -R assets site_out/; fi
          # Tess video is hosted externally (Sora); no local binary needed
          # Provide root-level Examples redirect if present
          if [ -f Examples.html ]; then cp Examples.html site_out/Examples.html; fi
          # Publish reports (static HTML/JSON/CSV) under /reports
          if [ -d reports ]; then mkdir -p site_out/reports; cp -R reports/* site_out/reports/; fi
          # Include updated LLM snapshot under /docs
          if [ -f docs/repo_snapshot.jsonl ]; then cp docs/repo_snapshot.jsonl site_out/docs/; fi
          # Optional root files (CNAME/404)
          if [ -f CNAME ]; then cp CNAME site_out/; fi
          if [ -f 404.html ]; then cp 404.html site_out/; fi
          # Ensure sitemap/robots present (already in docs build)
          true

      - name: Accessibility (WCAG2AA) on index.html and docs
        continue-on-error: true
        run: |
          npm --version || (curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs)
          npx --yes pa11y-ci file://${{ github.workspace }}/index.html || true
          npx --yes pa11y-ci file://${{ github.workspace }}/docs_build/html/index.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
