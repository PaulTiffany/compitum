name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -e .

      - name: Link check
        run: sphinx-build -W -b linkcheck docs docs_build/linkcheck

      - name: Build Sphinx HTML
        run: |
          sphinx-build -W -b html docs docs_build/html

      - name: Assemble site (hero index + docs at root and /docs)
        run: |
          set -euo pipefail
          mkdir -p site_out
          mkdir -p site_out/docs
          # Copy Sphinx docs to root (preserve cool /Page.html links)
          cp -R docs_build/html/* site_out/
          # Also provide docs under /docs for stable hub navigation
          cp -R docs_build/html/* site_out/docs/
          # Overwrite root index with hero landing page and include assets
          cp index.html site_out/index.html
          if [ -d assets ]; then cp -R assets site_out/; fi
          # Optional root files (CNAME/404)
          if [ -f CNAME ]; then cp CNAME site_out/; fi
          if [ -f 404.html ]; then cp 404.html site_out/; fi
          # Ensure sitemap/robots present (already in docs build)
          true

      - name: Accessibility (WCAG2AA) on index.html and docs
        continue-on-error: true
        run: |
          npm --version || (curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs)
          npx --yes pa11y-ci file://${{ github.workspace }}/index.html || true
          npx --yes pa11y-ci file://${{ github.workspace }}/docs_build/html/index.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
