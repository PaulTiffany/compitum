name: Docs

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install -e .

      - name: Link check
        run: sphinx-build -W -b linkcheck docs docs_build/linkcheck

      - name: Build Sphinx HTML (nitpicky)
        run: |
          sphinx-build -n -W -b html docs docs_build/html

      - name: Build LLM snapshot (Paleae)
        env:
          PALEAE_REF: ${{ vars.PALEAE_REF }}
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/PaulTiffany/paleae.git"
          CLONE_DIR="$RUNNER_TEMP/paleae"
          if [ -n "${PALEAE_REF:-}" ]; then
            echo "Cloning Paleae at ref '${PALEAE_REF}' for determinism"
            git clone --depth 1 --branch "$PALEAE_REF" "$REPO_URL" "$CLONE_DIR" || {
              echo "Ref '${PALEAE_REF}' not found; falling back to default";
              git clone --depth 1 "$REPO_URL" "$CLONE_DIR";
            }
          else
            echo "PALEAE_REF not set; cloning default branch"
            git clone --depth 1 "$REPO_URL" "$CLONE_DIR"
          fi
          python tools/build_llm_context_pack.py --paleae-path "$CLONE_DIR/paleae.py" --out docs/repo_snapshot.jsonl --format jsonl --target-size 1MB

      - name: Assemble site (hero index + docs under /docs)
        run: |
          set -euo pipefail
          mkdir -p site_out
          mkdir -p site_out/docs
          # Provide docs under /docs for stable navigation
          cp -R docs_build/html/* site_out/docs/
          # Overwrite root index with hero landing page and include assets
          cp index.html site_out/index.html
          if [ -d assets ]; then cp -R assets site_out/; fi
          # Publish only the reviewed, self-contained figures (NOT heavy/unaudited media)
          if [ -d media/reviewed ]; then
            mkdir -p site_out/media/reviewed
            cp media/reviewed/*.svg site_out/media/reviewed/ 2>/dev/null || true
          fi
          # Tess video (assets/tess.mp4, generated with Sora 2 -- see docs/Media.md
          # for provenance) is a real, git-tracked local asset copied by the
          # `assets` copy step above; it was briefly served externally in an
          # earlier revision, but that is no longer how it's deployed.
          # Provide root-level Examples redirect if present
          if [ -f Examples.html ]; then cp Examples.html site_out/Examples.html; fi
          # Publish reports (static HTML/JSON/CSV) under /reports
          if [ -d reports ]; then mkdir -p site_out/reports; cp -R reports/* site_out/reports/; fi
          # Include updated LLM snapshot under /docs
          if [ -f docs/repo_snapshot.jsonl ]; then cp docs/repo_snapshot.jsonl site_out/docs/; fi
          # Optional root files (CNAME/404)
          if [ -f CNAME ]; then cp CNAME site_out/; fi
          if [ -f 404.html ]; then cp 404.html site_out/; fi
          # Ensure sitemap/robots present (already in docs build)
          true

      - name: Accessibility (WCAG2AA) on index.html and docs
        continue-on-error: true
        run: |
          npm --version || (curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs)
          npx --yes pa11y-ci file://${{ github.workspace }}/index.html || true
          npx --yes pa11y-ci file://${{ github.workspace }}/docs_build/html/index.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
