name: Mutation Dispatcher

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Enable CR gating (advisory artifacts still produced)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: mutation-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # If GitHub ever instantiates this workflow on unsupported events (e.g., push),
    # finish immediately so the run is marked successful instead of failed/skipped.
    if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "mutation_dispatch is manual/scheduled only; current event=${{ github.event_name }} (noop)."

  mutmut-shard:
    # Run on schedule only if explicitly enabled; always allow manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.ENABLE_MUTATION_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        file: [
          "metric.py","constraints.py","router.py","predictors.py","control.py",
          "energy.py","models.py","pgd.py","utils.py","symbolic.py","coherence.py",
          "security.py","embedding_pgd.py","effort_qp.py","capabilities.py","boundary.py"
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install mutmut pytest-cov

      - name: Mutmut shard (${{ matrix.file }})
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          PYTEST_ADDOPTS: -q -m "not routerbench and not examples and not heavy_bench"
          HYPOTHESIS_PROFILE: mutation_ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -e
          mkdir -p reports
          TARGET_FILE="${{ matrix.file }}"
          TEST_PATHS="tests/router tests/metric tests/predictors tests/pgd"
          # Baseline with coverage to inform mutmut
          pytest -q --cov="src/compitum/${TARGET_FILE}" --cov-branch --cov-fail-under=0 $TEST_PATHS
          mutmut run \
            --paths-to-mutate "src/compitum/${TARGET_FILE}" \
            --tests-dir tests \
            --use-coverage || true
          BASE="${TARGET_FILE%.py}"
          mutmut results | tee "reports/mutmut_results_${BASE}.txt"
          mutmut results --all | tee "reports/mutmut_results_${BASE}_full.txt" || true

      - name: Mutmut survivor details (${{ matrix.file }})
        if: always()
        run: |
          set -e
          TARGET_FILE="${{ matrix.file }}"; BASE="${TARGET_FILE%.py}"
          OUT="reports/mutmut_survivors_${BASE}.txt"
          echo "# Mutmut survivors for ${BASE}" > "$OUT" || true
          BASE="$BASE" python - << 'PY'
          import os, re, subprocess
          base = os.environ.get('BASE','')
          path = f'reports/mutmut_results_{base}.txt'
          out = f'reports/mutmut_survivors_{base}.txt'
          try:
              txt = open(path,'r',encoding='utf-8',errors='ignore').read()
          except Exception:
              txt = None
          ids = re.findall(r'\((\d+)\)', txt or '')
          with open(out,'a',encoding='utf-8') as f:
              for mid in ids:
                  try:
                      details = subprocess.check_output(['mutmut','show',mid], text=True, errors='ignore')
                  except Exception as e:
                      details = f'<error showing {mid}: {e}>'
                  f.write('\n## survivor '+mid+'\n\n'+details+'\n')
          PY
          echo "Wrote survivor details (if any) to $OUT"

      - name: Upload artifacts (mutmut shard)
        uses: actions/upload-artifact@v4
        with:
          name: mutation-validation-mutmut-${{ matrix.file }}
          path: |
            reports/*.txt
          retention-days: 7

  cr-quick-shard:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.ENABLE_MUTATION_SCHEDULE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [
          metric, constraints, router, predictors, control, energy, models, pgd, utils,
          symbolic, coherence, security, embedding_pgd, effort_qp, capabilities, boundary
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install cosmic-ray cr-report

      - name: Prepare CR config (${{ matrix.group }})
        env:
          HYPOTHESIS_PROFILE: mutation_ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          PYTEST_COVERAGE: 1
        run: |
          set -e
          GROUP="${{ matrix.group }}"
          CFG="$RUNNER_TEMP/cr_${GROUP}.toml"
          printf '%s\n' \
            "[cosmic-ray]" \
            "module = \"compitum\"" \
            "module-path = \"src\"" \
            "test-command = \"bash scripts/cr_pytest.sh\"" \
            "timeout = 240.0" \
            "coverage-file = \".coverage\"" \
            "" \
            "excluded-modules = [" \
            "    \"tests/*\"," \
            "    \"**/__init__.py\"," \
            "    \"routerbench.*\"," \
            "    \"compitum.cli\"," \
            "    \"compitum.utils\"," \
            "    \"compitum.symbolic\"," \
            "    \"compitum.security\"," \
            "    \"compitum.pgd\"," \
            "    \"compitum.models\"," \
            "    \"compitum.embedding_pgd\"," \
            "    \"compitum.effort_qp\"," \
            "    \"compitum.coherence\"," \
            "    \"compitum.capabilities\"," \
            "    \"compitum.boundary\"," \
            "    \"compitum.control\"," \
            "    \"compitum.energy\"," \
            "]" \
            "" \
            "[cosmic-ray.distributor]" \
            "name = \"local\"" \
            > "$CFG"
          # Narrow to target group
          sed -i "s/\"compitum.${GROUP}\",//" "$CFG" || true
          echo "Using CR config:"; cat "$CFG"

          mkdir -p reports
          SESSION_DB="$RUNNER_TEMP/cr-${GROUP}-${{ github.run_id }}.sqlite"
          cosmic-ray init --force "$CFG" "$SESSION_DB"
          cosmic-ray exec "$CFG" "$SESSION_DB"
          cr-report "$SESSION_DB" > "reports/cr_quick_summary_${GROUP}.txt"
          cosmic-ray dump "$SESSION_DB" > "reports/cr_quick_dump_${GROUP}.jsonl"
          python tools/mutation_summary.py "reports/cr_quick_dump_${GROUP}.jsonl" "reports/cr_quick_summary_${GROUP}.json"
          GROUP="$GROUP" python -c "import json, os, sys; g=os.environ.get('GROUP',''); path=f'reports/cr_quick_summary_{g}.json';\
            try: s=json.load(open(path,'r',encoding='utf-8')); score=float(s.get('mutation_score',0)); print('CR quick (advisory)', g, 'score:', score); \
            except Exception as e: print('CR quick (advisory)', g, 'error:', e, file=sys.stderr); sys.exit(0)"

      - name: Upload artifacts (CR shard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-validation-cr-${{ matrix.group }}
          path: |
            reports/cr_quick_summary_${{ matrix.group }}.*
            reports/cr_quick_dump_${{ matrix.group }}.jsonl
          retention-days: 7

  summarize:
    needs: [mutmut-shard, cr-quick-shard]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download mutation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-validation-*
          merge-multiple: true
      - name: Aggregate summary
        run: |
          python - << 'PY'
            import json, glob, os
            cr_jsons = glob.glob('**/cr_quick_summary_*.json', recursive=True)
            mutmut_txts = glob.glob('**/mutmut_results_*.txt', recursive=True)
            survivors = []
            for p in mutmut_txts:
                try:
                    txt = open(p, 'r', encoding='utf-8', errors='ignore').read().lower()
                    if 'survived' in txt:
                        survivors.append(os.path.basename(p))
                except Exception:
                    pass
            scores = {}
            for p in cr_jsons:
                try:
                    d = json.load(open(p, 'r', encoding='utf-8'))
                    scores[os.path.basename(p)] = d.get('mutation_score', 0)
                except Exception:
                    pass
            open('MUTATION_SUMMARY.json','w',encoding='utf-8').write(json.dumps({'survivors': survivors, 'scores': scores}, indent=2))
PY
      - name: Job summary
        run: |
          printf "## Mutation Dispatcher Summary\n" >> "$GITHUB_STEP_SUMMARY"
          if [ -f MUTATION_SUMMARY.json ]; then
            printf "\n<details><summary>Summary JSON</summary>\n\n" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/    /' MUTATION_SUMMARY.json >> "$GITHUB_STEP_SUMMARY" || true
            printf "\n</details>\n" >> "$GITHUB_STEP_SUMMARY"
          fi
