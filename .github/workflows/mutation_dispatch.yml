name: Mutation (Sharded Dispatch)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

concurrency:
  group: mutation-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-sharded-mutation:
    uses: ./.github/workflows/mutation.yml
    with:
      mutmut: true
      mutmut_gate: false
      cr_quick: true
      cr_full: false
    secrets: inherit

