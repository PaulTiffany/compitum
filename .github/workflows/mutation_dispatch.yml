name: Mutation Dispatcher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: mutation-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-sharded-mutation:
    # Run on schedule only if explicitly enabled; always allow manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.ENABLE_MUTATION_SCHEDULE == 'true')
    uses: ./.github/workflows/mutation.yml
    with:
      mutmut: true
      mutmut_gate: false
      cr_quick: true
      cr_full: false
      cr_gate: false
      cr_score_threshold: '0.0'
    secrets: inherit
