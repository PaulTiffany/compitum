name: Mutation Dispatcher

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Enable CR gating (advisory artifacts still produced)'
        required: false
        default: 'false'
      target_files:
        description: 'JSON array of filenames to scope the mutmut sweep to (e.g. ["metric.py","pgd.py"]); empty = full 17-file matrix'
        required: false
        default: ''
      cr_quick:
        description: 'Also run the secondary Cosmic Ray quick-check shards (much slower, advisory only -- leave off for a fast mutmut-only re-verification)'
        required: false
        default: 'true'
  schedule:
    # Weekly, not daily: the full mutmut+Cosmic Ray sweep is real compute even
    # though this repo's public-repo Actions minutes are free. PRs labeled
    # "mutation" (mutation_on_label.yml) already give a fast, diff-scoped
    # check in between full sweeps.
    - cron: '0 7 * * 0'

permissions:
  contents: read

concurrency:
  group: mutation-dispatch-${{ github.ref }}
  # false, not true: mutation sweeps are expensive (up to hours), and a
  # second manual dispatch against the same ref is much more likely to be a
  # deliberate, complementary re-run (e.g. re-running just the files a prior
  # dispatch's concurrency collision cut off) than a supersession -- unlike
  # mutation_on_label.yml, where a new PR commit genuinely should cancel a
  # stale in-flight check for the old one. Queueing means the second
  # dispatch waits its turn instead of silently destroying the first run's
  # progress, which happened twice in one session before this fix.
  cancel-in-progress: false

jobs:
  guard:
    # If GitHub ever instantiates this workflow on unsupported events (e.g., push),
    # finish immediately so the run is marked successful instead of failed/skipped.
    if: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "mutation_dispatch is manual/scheduled only; current event=${{ github.event_name }} (noop)."

  mutation:
    # Run on schedule only if explicitly enabled; always allow manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.ENABLE_MUTATION_SCHEDULE == 'true')
    uses: ./.github/workflows/mutation.yml
    with:
      mutmut: true
      # Schedule runs always include the CR quick-check; manual dispatches can
      # skip it (default on, to preserve prior behavior) for a fast mutmut-only
      # re-verification run.
      cr_quick: ${{ github.event_name != 'workflow_dispatch' || inputs.cr_quick == 'true' }}
      cr_gate: ${{ inputs.strict == 'true' }}
      cr_score_threshold: '1.0'
      target_files: ${{ inputs.target_files }}
    secrets: inherit

  summarize:
    needs: [mutation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download mutation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-validation-*
          merge-multiple: true
      - name: Aggregate summary
        run: python tools/aggregate_mutation_summary.py MUTATION_SUMMARY.json
      - name: Job summary
        run: |
          printf "## Mutation Dispatcher Summary\n" >> "$GITHUB_STEP_SUMMARY"
          if [ -f MUTATION_SUMMARY.json ]; then
            printf "\n<details><summary>Summary JSON</summary>\n\n" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/    /' MUTATION_SUMMARY.json >> "$GITHUB_STEP_SUMMARY" || true
            printf "\n</details>\n" >> "$GITHUB_STEP_SUMMARY"
          fi
