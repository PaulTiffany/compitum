name: Mutation PR Label

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: mutation-label-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute-files:
    if: ${{ contains(join(github.event.pull_request.labels.*.name, ' '), 'mutation') }}
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changed.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute changed compitum modules
        id: changed
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const res = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const files = res.data.map(f => f.filename);
            const mods = files.filter(f => f.startsWith('src/compitum/') && f.endsWith('.py')).map(f => f.split('/').pop());
            const unique = [...new Set(mods)];
            core.setOutput('files', unique.length ? JSON.stringify(unique) : '');

  run-on-label:
    needs: compute-files
    if: ${{ contains(join(github.event.pull_request.labels.*.name, ' '), 'mutation') && needs.compute-files.outputs.files != '' }}
    uses: ./.github/workflows/mutation.yml
    with:
      mutmut: true
      mutmut_gate: false
      cr_quick: true
      cr_full: false
      cr_score_threshold: '1.0'
      target_files: ${{ needs.compute-files.outputs.files }}
    secrets: inherit

  summarize-and-comment:
    needs: run-on-label
    if: ${{ always() && contains(join(github.event.pull_request.labels.*.name, ' '), 'mutation') && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download mutation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-validation-*
          merge-multiple: true
      - name: Summarize mutation results
        id: summarize
        run: |
          python - << 'PY'
import json, os, glob
cr_jsons = glob.glob('**/cr_quick_summary_*.json', recursive=True)
mutmut_txts = glob.glob('**/mutmut_results_*.txt', recursive=True)
survivors = []
for p in mutmut_txts:
    try:
        txt = open(p, 'r', encoding='utf-8', errors='ignore').read().lower()
        if 'survived' in txt:
            survivors.append(os.path.basename(p))
    except Exception:
        pass
scores = {}
for p in cr_jsons:
    try:
        d = json.load(open(p, 'r', encoding='utf-8'))
        scores[os.path.basename(p)] = d.get('mutation_score', 0)
    except Exception:
        pass
with open('mutation_summary_payload.json','w',encoding='utf-8') as f:
    json.dump({'survivors': survivors, 'scores': scores}, f)
PY
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('mutation_summary_payload.json','utf-8'));
            const lines = [];
            lines.push('### Mutation (sharded) summary');
            const scores = payload.scores || {};
            if (Object.keys(scores).length) {
              lines.push('Cosmic Ray scores:');
              for (const [k,v] of Object.entries(scores)) { lines.push(`- ${k}: ${v}`); }
            }
            const surv = payload.survivors || [];
            if (surv.length) {
              lines.push('Mutmut survivors detected in:');
              for (const f of surv) { lines.push(`- ${f}`); }
            } else {
              lines.push('Mutmut: all mutants killed');
            }
            const body = lines.join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
