name: RouterBench Online (guarded)

on:
  workflow_dispatch:
    inputs:
      enable:
        description: 'Run RouterBench online (advisory)'
        required: false
        default: 'true'
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: routerbench-online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  online:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.enable == 'true' ||
      (github.event_name == 'schedule' && vars.ENABLE_ROUTERBENCH_ONLINE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            src/routerbench/requirements.txt

      - name: Install RouterBench deps (guarded)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if [ -f src/routerbench/requirements.txt ]; then pip install -r src/routerbench/requirements.txt; else echo "No routerbench requirements.txt; proceeding"; fi

      - name: Attempt dataset fetch if missing (advisory)
        continue-on-error: true
        run: |
          set -e
          if [ -f src/routerbench/routerbench_5shot.pkl ] || [ -f data/routerbench_5shot.pkl ] || [ -f routerbench_5shot.pkl ]; then
            echo "RouterBench dataset present."
          else
            echo "Dataset missing; trying scripts/fetch_routerbench.py (advisory)"
            if [ -f scripts/fetch_routerbench.py ]; then
              python scripts/fetch_routerbench.py || true
            else
              echo "fetch_routerbench.py not found; skipping fetch."
            fi
          fi

      - name: Import smoke
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/src/routerbench
        run: |
          python - << 'PY'
import importlib, sys
sys.path.extend(['.', './src', './src/routerbench'])
rb = importlib.import_module('routerbench.evaluate_routers')
print('routerbench import ok:', rb.__name__)
PY

      - name: Run RouterBench subset if data present (advisory)
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          if [ -f src/routerbench/routerbench_5shot.pkl ] || [ -f data/routerbench_5shot.pkl ] || [ -f routerbench_5shot.pkl ]; then \
            pytest -q -m routerbench || true; \
          else \
            echo "RouterBench dataset missing; skipping tests"; \
          fi

      - name: Upload artifacts (advisory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routerbench-online-artifacts
          path: |
            data/rb_clean/eval_results/**/*
            reports/**/*
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          echo "## RouterBench Online (advisory)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f src/routerbench/routerbench_5shot.pkl ] || [ -f data/routerbench_5shot.pkl ] || [ -f routerbench_5shot.pkl ]; then
            echo "\n- Dataset: present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "\n- Dataset: missing (fetch skipped/failed)" >> "$GITHUB_STEP_SUMMARY"
          fi

