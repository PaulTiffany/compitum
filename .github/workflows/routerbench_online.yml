name: RouterBench Online (guarded)

on:
  workflow_dispatch:
    inputs:
      enable:
        description: 'Run RouterBench online (advisory)'
        required: false
        default: 'true'
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: routerbench-online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  online:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.enable == 'true' ||
      (github.event_name == 'schedule' && vars.ENABLE_ROUTERBENCH_ONLINE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONNECTION_STRING: ${{ secrets.ROUTERBENCH_CONNECTION_STRING }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            src/routerbench/requirements.txt

      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Require connection string (guard)
        shell: bash
        run: |
          if [ -z "${CONNECTION_STRING:-}" ]; then
            echo "::warning::ROUTERBENCH_CONNECTION_STRING not set; skipping online run."
            echo "## RouterBench Online (skipped)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Missing secret ROUTERBENCH_CONNECTION_STRING" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Prepare venv for RouterBench
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-routerbench
          . .venv-routerbench/bin/activate
          pip install --upgrade pip
          if [ -f src/routerbench/requirements.txt ]; then \
            pip install -r src/routerbench/requirements.txt; \
          else \
            echo "No routerbench requirements.txt; proceeding"; \
          fi
          pip install -e .

      - name: Fetch dataset (required)
        shell: bash
        env:
          CONNECTION_STRING: ${{ secrets.ROUTERBENCH_CONNECTION_STRING }}
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -euo pipefail
          . .venv-routerbench/bin/activate
          mkdir -p data
          echo "INFO: Fetching RouterBench dataset to data/routerbench_5shot.pkl"
          python scripts/fetch_routerbench.py --also-copy-to-src > data/fetch_output.log 2>&1 || {
            echo "::error::fetch_routerbench.py failed"; cat data/fetch_output.log; exit 1; }
          test -f data/routerbench_5shot.pkl || { echo "::error::routerbench_5shot.pkl missing"; exit 1; }

      - name: Import smoke
        env:
          CONNECTION_STRING: ${{ secrets.ROUTERBENCH_CONNECTION_STRING }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/src/routerbench
        run: |
          . .venv-routerbench/bin/activate
          python - << 'PY'
          import importlib, sys
          sys.path.extend(['.', './src', './src/routerbench'])
          rb = importlib.import_module('routerbench.evaluate_routers')
          print('routerbench import ok:', rb.__name__)
          PY
      - name: Run RouterBench (orchestrator)
        shell: bash
        env:
          CONNECTION_STRING: ${{ secrets.ROUTERBENCH_CONNECTION_STRING }}
          HYPOTHESIS_PROFILE: ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -euo pipefail
          . .venv-routerbench/bin/activate
          # Use the orchestrator; it will detect the venv at .venv-routerbench
          python tools/ci_orchestrator.py --bench-routerbench --config data/rb_clean/evaluate_routers.yaml --tokenizer-backend tiktoken --max-evals 200

      - name: Upload artifacts (advisory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routerbench-online-artifacts
          path: |
            data/rb_clean/eval_results/**/*
            reports/**/*
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          echo "## RouterBench Online (advisory)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f src/routerbench/routerbench_5shot.pkl ] || [ -f data/routerbench_5shot.pkl ] || [ -f routerbench_5shot.pkl ]; then
            echo "\n- Dataset: present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "\n- Dataset: missing (fetch skipped/failed)" >> "$GITHUB_STEP_SUMMARY"
          fi
