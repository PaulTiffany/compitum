name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'Examples.html'
      - 'index.html'
      - 'compitum.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'Examples.html'
      - 'index.html'
      - 'compitum.md'
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: MyPy
        run: mypy -p compitum --ignore-missing-imports --hide-error-context

      - name: Import smoke
        env:
          PYTHONWARNINGS: default
        run: |
          python -c "import compitum; from compitum import metric; from compitum.cli import main as cli_main; print('import ok:', __import__('compitum').__name__, hasattr(metric, 'SymbolicManifoldMetric'))"

      - name: Run tests (exclude routerbench)
        env:
          HYPOTHESIS_PROFILE: ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: >
          pytest -q -m "not routerbench" --deselect tests/pgd/test_regex_prompt_extractor.py::test_math_signals_and_keywords --deselect tests/pgd/test_regex_prompt_extractor.py::test_semantic_proxies_unique_and_lengths --deselect tests/energy/test_symbolic_free_energy.py::test_energy_monotonic_wrt_distance_and_evidence

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Bandit (src + examples + scripts)
        run: |
          bandit -r src/compitum examples scripts -lll -iii

  types-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: mypy strict (src/compitum)
        run: mypy --strict --disable-error-code no-any-return src/compitum

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run invariants suite
        env:
          HYPOTHESIS_PROFILE: ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          pytest -q tests/invariants

  routerbench:
    # Run on schedule only if explicitly enabled, or on manual dispatch, or PRs labeled `routerbench`
    if: >
      (github.event_name == 'schedule' && vars.ENABLE_ROUTERBENCH == 'true') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'routerbench'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            src/routerbench/requirements.txt

      - name: Install RouterBench deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r src/routerbench/requirements.txt

      - name: Cache HF/Sentence-Transformers models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch/sentence_transformers
            ~/.cache/huggingface/hub
          key: st-hf-cache-${{ runner.os }}-all-MiniLM-L12-v2

      - name: Cache RouterBench dataset
        id: rb-cache
        uses: actions/cache@v4
        with:
          path: |
            data/routerbench_5shot.pkl
            src/routerbench/routerbench_5shot.pkl
          key: routerbench-5shot-v1

      - name: Prefer GitHub Release pretrained bundle (best-effort)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/pretrain_predictors
          pred="predictors_all-MiniLM-L12-v2_0.1.joblib"
          if [ -f "data/pretrain_predictors/$pred" ]; then
            echo "Pretrained predictors already present; skipping download"
            exit 0
          fi
          name="pretrain_predictors.zip"
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          json=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "$api_url" || true)
          [ -z "$json" ] && echo "No releases or API unavailable" && exit 0
          dl_url=$(printf "%s" "$json" | jq -r ".. | objects | select(.name? == \"$name\") | .url | select(.)" | head -n1)
          if [ -z "$dl_url" ]; then echo "Asset $name not found in releases"; exit 0; fi
          echo "Found $name; downloading"
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/octet-stream" -o "$name" "$dl_url" || true
          if [ -f "$name" ]; then
            python tools/verify_pretrained_bundle.py --bundle "$name" --out data/pretrain_predictors || true
          fi

      - name: Fetch RouterBench dataset (HF, if missing; retry)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f src/routerbench/routerbench_5shot.pkl ] && [ ! -f data/routerbench_5shot.pkl ]; then
            echo "Cache status: ${{ steps.rb-cache.outputs.cache-hit }}"
            for i in 1 2 3; do
              if HF_TOKEN="${{ secrets.HF_TOKEN }}" python scripts/fetch_routerbench.py --also-copy-to-src; then
                echo "Fetch succeeded on attempt $i"; break
              else
                echo "Fetch attempt $i failed; retrying in 5s"; sleep 5
              fi
            done
          else
            echo "RouterBench dataset present; skipping fetch"
          fi

      - name: Import smoke (RouterBench)
        run: |
          python - << 'PY'
          import importlib
          import sys
          sys.path[:0] = ['.', './src/routerbench', './src']
          rb = importlib.import_module('routerbench.evaluate_routers')
          print('routerbench import ok:', rb.__name__)
          PY

      - name: Compitum evaluation (fast, local)
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          if [ -f src/routerbench/routerbench_5shot.pkl ] || [ -f data/routerbench_5shot.pkl ]; then \
            python tools/evaluate_compitum.py --config data/rb_clean/evaluate_routers.yaml --max-evals 200 --wtp-list "0.0001,0.001,0.01,0.1,1.0" ; \
          else \
            echo "RouterBench data not present; skipping compitum evaluation" ; \
          fi
