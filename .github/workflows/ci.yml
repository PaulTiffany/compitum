name: CI

on:
  workflow_dispatch:
    inputs:
      routerbench:
        description: 'Run routerbench job (on manual dispatch only)'
        required: false
        default: 'false'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'Examples.html'
      - 'index.html'
      - 'compitum.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'Examples.html'
      - 'index.html'
      - 'compitum.md'
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy pytest pytest-cov hypothesis jsonschema types-PyYAML

      - name: Lint
        run: ruff check .

      - name: MyPy
        run: mypy -p compitum --ignore-missing-imports --hide-error-context

      - name: Import smoke
        env:
          PYTHONWARNINGS: default
        run: |
          python -c "import compitum; from compitum import metric; from compitum.cli import main as cli_main; print('import ok:', __import__('compitum').__name__, hasattr(metric, 'SymbolicManifoldMetric'))"

      - name: Run tests (exclude routerbench)
        shell: bash
        env:
          HYPOTHESIS_PROFILE: ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -e
          echo "Running pytest with verbose summary for CI..."
          pytest -m "not routerbench and not heavy_bench" -ra -vv --maxfail=1 \
            --deselect tests/pgd/test_regex_prompt_extractor.py::test_math_signals_and_keywords \
            --deselect tests/pgd/test_regex_prompt_extractor.py::test_semantic_proxies_unique_and_lengths \
            --deselect tests/energy/test_symbolic_free_energy.py::test_energy_monotonic_wrt_distance_and_evidence

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Bandit (src + tools + examples + scripts)
        run: |
          bandit -r src/compitum tools examples scripts -lll -iii

  types-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install minimal type-check deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mypy types-PyYAML
      - name: mypy strict (src/compitum)
        run: mypy --strict --disable-error-code no-any-return src/compitum

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest hypothesis jsonschema pytest-cov

      - name: Run invariants suite
        env:
          HYPOTHESIS_PROFILE: ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          pytest -q tests/invariants

  routerbench:
    # Run on schedule only if explicitly enabled, or on manual dispatch, or label `routerbench` on PRs
    if: >
      (github.event_name == 'schedule' && vars.ENABLE_ROUTERBENCH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.routerbench == 'true') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'routerbench'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            src/routerbench/requirements.txt

      - name: Install RouterBench deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r src/routerbench/requirements.txt
          # Needed for the routerbench-marked pytest integration
          pip install pytest

      - name: Attempt dataset fetch (advisory)
        if: >
          (github.event_name == 'schedule' && vars.ENABLE_ROUTERBENCH == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.routerbench == 'true') ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'routerbench'))
        continue-on-error: true
        shell: bash
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -euo pipefail
          mkdir -p data
          echo "INFO: Fetching RouterBench dataset (advisory)"
          python scripts/fetch_routerbench.py --also-copy-to-src > data/fetch_output.log 2>&1 || true

      - name: Import smoke (RouterBench)
        env:
          CONNECTION_STRING: mongodb://localhost:27017
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/src/routerbench
        run: |
          python - << 'PY'
          import importlib
          import sys
          sys.path.extend(['.', './src', './src/routerbench'])
          rb = importlib.import_module('routerbench.evaluate_routers')
          print('routerbench import ok:', rb.__name__)
          PY

      - name: Run RouterBench tests if data present
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          if [ -f src/routerbench/routerbench_5shot.pkl ]; then \
            pytest -q -m routerbench ; \
          else \
            echo "RouterBench data not present; skipping routerbench tests" ; \
          fi

      - name: Job summary (routerbench)
        if: always()
        shell: bash
        run: |
          echo "## RouterBench (CI)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f src/routerbench/routerbench_5shot.pkl ] || [ -f data/routerbench_5shot.pkl ]; then
            echo "\n- Dataset: present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "\n- Dataset: missing (fetch skipped/failed)" >> "$GITHUB_STEP_SUMMARY"
          fi

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Install from wheel and import smoke
        run: |
          python -m venv venv-pkgs
          . venv-pkgs/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python - << 'PY'
          import compitum
          from compitum.cli import main as cli_main
          print('import ok; version:', getattr(compitum, '__version__', 'unknown'))
          PY

  applications-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install matplotlib
          pip install matplotlib
          pip install matplotlib
          pip install matplotlib
      - name: Applications import smoke
        run: |
          python - << 'PY'
          import numpy as np
          from compitum.applications import PlasmaMonitor
          pm = PlasmaMonitor(state_dim=4, rank=2)
          out = pm.ingest_profile(np.zeros(4), 0.0)
          print('applications import ok:', isinstance(out, dict), out['confinement_distance'] >= 0.0)
          PY

  matbench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run matbench smoke (demo CSV)
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          python tools/ci_orchestrator.py \
            --bench-matbench \
            --matbench-csv data/matbench_demo.csv \
            --matbench-objective-col y_true \
            --matbench-mode max \
            --matbench-topk-grid "1,3" \
            --matbench-lambda-grid "0.0,0.5,1.0" \
            --matbench-bootstrap 30 \
            --timeout-matbench 420
      - name: Upload matbench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matbench-smoke
          path: |
            reports/matbench_*_smoke.*
          retention-days: 7
  cli-smoke-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: CLI --help smoke
        run: |
          python tools/eval_matbench_srmf.py --help > /dev/null
          python tools/eval_matbench_regret.py --help > /dev/null
          python tools/calibrate_matbench_srmf.py --help > /dev/null
          
          python tools/eval_baseline_regret.py --help > /dev/null
          python tools/explore_matbench_layers.py --help > /dev/null
          python examples/generate_matbench_demo.py --help > /dev/null
      - name: CLI offline audit smoke
        run: |
          python tools/audit_materials_manifold.py --offline-mock --out audit_mock.csv
          test -s audit_mock.csv
