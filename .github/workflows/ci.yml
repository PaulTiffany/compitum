name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'

jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: MyPy
        run: mypy -p compitum --ignore-missing-imports --hide-error-context

      - name: Import smoke
        env:
          PYTHONWARNINGS: default
        run: |
          python -c "import compitum; from compitum import metric; from compitum.cli import main as cli_main; print('import ok:', __import__('compitum').__name__, hasattr(metric, 'SymbolicManifoldMetric'))"

      - name: Run tests (exclude routerbench)
        env:
          HYPOTHESIS_PROFILE: ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          # Use CI-friendly PGD tests; exclude strict regex extractor cases
          pytest -q -m "not routerbench" -k "not tests/pgd/test_regex_prompt_extractor.py"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Bandit (src + examples + scripts)
        run: |
          bandit -r src/compitum examples scripts -lll -iii

  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run invariants suite
        env:
          HYPOTHESIS_PROFILE: ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          pytest -q tests/invariants

  routerbench:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            src/routerbench/requirements.txt

      - name: Install RouterBench deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r src/routerbench/requirements.txt

      - name: Import smoke (RouterBench)
        run: |
          python - << 'PY'
          import importlib
          import sys
          sys.path.extend(['.', './src'])
          rb = importlib.import_module('routerbench.evaluate_routers')
          print('routerbench import ok:', rb.__name__)
          PY

      - name: Run RouterBench tests if data present
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          if [ -f src/routerbench/routerbench_5shot.pkl ]; then \
            pytest -q -m routerbench ; \
          else \
            echo "RouterBench data not present; skipping routerbench tests" ; \
          fi
