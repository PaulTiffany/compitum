name: Embed notebooks into wiki

on:
  push:
    paths:
      - 'notebooks/**'
      - 'scripts/embed_notebooks_in_wiki.py'
      - 'notebooks/wiki_map.yaml'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: compitum.wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert pyyaml

      - name: Generate and embed notebook markdown
        run: python scripts/embed_notebooks_in_wiki.py

      - name: Commit and push wiki changes
        working-directory: compitum.wiki
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update wiki from notebooks [skip ci]"
            git push
          else
            echo "No changes to commit."

