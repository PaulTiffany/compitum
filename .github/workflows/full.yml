name: Validation Full

on:
  workflow_dispatch:
    inputs:
      mutation_sharded:
        description: 'Run sharded mutation workflow (mutmut + CR quick)'
        required: false
        default: 'false'

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            src/routerbench/requirements.txt

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

  mutation-sharded:
    if: ${{ inputs.mutation_sharded == 'true' }}
    name: Mutation (sharded)
    uses: ./.github/workflows/mutation.yml
    with:
      cr_quick: true
      cr_gate: true
      cr_score_threshold: '1.0'
      target_files: ''
    secrets: inherit