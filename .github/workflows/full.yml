name: Validation Full

on:
  workflow_dispatch:
    inputs:
      mutation:
        description: 'Run mutation testing (cosmic-ray)'
        required: false
        default: 'false'
      mutmut:
        description: 'Run mutation testing (mutmut)'
        required: false
        default: 'false'
      mutation_sharded:
        description: 'Run sharded mutation workflow (mutmut + CR quick)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            src/routerbench/requirements.txt

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run heavy benchmarks
        if: ${{ github.event_name == 'schedule' }}
        env:
          HYPOTHESIS_PROFILE: ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          pytest -q -m heavy_bench

      - name: Run mutation testing (cosmic-ray)
        if: ${{ inputs.mutation == 'true' || vars.ENABLE_MUTATION == 'true' }}
        timeout-minutes: 45
        env:
          # Use a lighter profile on CI for throughput; script defaults to 'mutation' locally
          HYPOTHESIS_PROFILE: ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          mkdir -p reports
          SESSION_DB="$RUNNER_TEMP/session-${{ github.run_id }}.sqlite"
          # Use CI-tuned config with a higher timeout
          cosmic-ray init --force cosmic-ray.ci.toml "$SESSION_DB"
          cosmic-ray exec cosmic-ray.ci.toml "$SESSION_DB"
          # Human-readable text report
          cr-report "$SESSION_DB" > reports/mutation_summary.txt
          # Machine-readable dump + compact JSON summary and gate on score
          cosmic-ray dump "$SESSION_DB" > reports/cr_dump.jsonl
          python tools/mutation_summary.py reports/cr_dump.jsonl reports/mutation_summary.json
          python - << 'PY'
          import json, sys
          s = json.load(open('reports/mutation_summary.json','r',encoding='utf-8'))
          score = float(s.get('mutation_score', 0.0))
          print('Cosmic Ray mutation score:', score)
          # Fail if any survivors (score < 1.0)
          sys.exit(0 if score >= 1.0 else 1)
          PY

      - name: Install mutmut
        if: ${{ inputs.mutmut == 'true' || vars.ENABLE_MUTMUT == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install mutmut

      - name: Run mutation testing (mutmut)
        if: ${{ inputs.mutmut == 'true' || vars.ENABLE_MUTMUT == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          # Narrow test selection to stable suites for mutation
          PYTEST_ADDOPTS: --no-cov -q -m "not routerbench and not examples and not heavy_bench"
          HYPOTHESIS_PROFILE: mutation
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          mkdir -p reports
          # Baseline: ensure selected tests pass before mutation
          pytest -q -m "not routerbench and not examples and not heavy_bench"
          # Run mutmut using pyproject config (tests_dir + paths_to_mutate)
          mutmut run
          mutmut results | tee reports/mutmut_results.txt
          # Fail if any mutants survived
          if grep -qi "survived" reports/mutmut_results.txt; then \
            echo "Mutmut: survivors detected" && exit 1; \
          else \
            echo "Mutmut: all mutants killed"; \
          fi

      - name: Prepare routerbench venv and deps
        run: |
          python -m venv .venv-routerbench
          . .venv-routerbench/bin/activate
          pip install --upgrade pip
          pip install -r src/routerbench/requirements.txt
          pip install -e .

      - name: RouterBench tests (guarded)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          HYPOTHESIS_PROFILE: ci
        run: |
          if [ -f src/routerbench/routerbench_5shot.pkl ] || [ -f data/routerbench_5shot.pkl ] || [ -f routerbench_5shot.pkl ]; then \
            . .venv-routerbench/bin/activate && python -m pytest -q -m routerbench ; \
          else \
            echo "RouterBench dataset missing; skipping routerbench tests" ; \
          fi

      - name: Peer-review orchestration (guarded)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          . .venv-routerbench/bin/activate
          python tools/ci_orchestrator.py --all --config data/rb_clean/evaluate_routers.yaml --wtp-list "0.0001,0.001,0.01,0.1,1.0"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: full-validation-artifacts
          path: |
            reports/**
            data/rb_clean/eval_results/**/*.csv
            data/rb_clean/eval_results/**/*.pkl
          retention-days: 14
  # mutation-sharded job temporarily disabled due to reusable workflow YAML validation; re-enable after fix

