name: Validation Full

on:
  workflow_dispatch:
    inputs:
      mutation_sharded:
        description: 'Run sharded mutation workflow (mutmut + CR quick)'
        required: false
        default: 'false'

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            src/routerbench/requirements.txt

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      
      - name: Run RouterBench Suite (prep only)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          HYPOTHESIS_PROFILE: ci
        run: |
          set -e
          echo "INFO: Preparing venv for RouterBench"
          python -m venv .venv-routerbench
          . .venv-routerbench/bin/activate
          pip install --upgrade pip
          pip install -r src/routerbench/requirements.txt
          pip install -e .

          echo "INFO: Current working directory: $(pwd)"
          echo "INFO: Contents of 'scripts' directory:"
          ls -F scripts/
          echo "INFO: Contents of 'data' directory:"
          ls -F data/ || true # List data dir, don't fail if empty

          echo "INFO: Fetching RouterBench dataset"
          mkdir -p data # Ensure data directory exists
          # Run from data dir, capture output and exit code
          python scripts/fetch_routerbench.py > data/fetch_output.log 2>&1 # Run from root
          FETCH_EXIT_CODE=$?
          echo "INFO: fetch_routerbench.py exited with code: $FETCH_EXIT_CODE"
          echo "INFO: Output of fetch_routerbench.py:"
          cat data/fetch_output.log

          if [ $FETCH_EXIT_CODE -ne 0 ]; then
            echo "::error::fetch_routerbench.py failed with exit code $FETCH_EXIT_CODE"
            exit 1
          fi

          if [ ! -f "data/routerbench_5shot.pkl" ]; then
            echo "::error::Failed to download routerbench_5shot.pkl to data/routerbench_5shot.pkl"
            exit 1
          fi
          echo "INFO: RouterBench dataset downloaded successfully to data/routerbench_5shot.pkl."

          echo "INFO: Skipping pytest for RouterBench on Linux; orchestrator runs next"

      - name: Peer-review orchestration
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          . .venv-routerbench/bin/activate
          python tools/ci_orchestrator.py --all --config data/rb_clean/evaluate_routers.yaml --wtp-list "0.0001,0.001,0.01,0.1,1.0"

      - name: Upload artifacts (RB + report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-validation-artifacts
          path: |
            data/rb_clean/eval_results/**/*
            reports/**/*
          retention-days: 7

      - name: Job summary (Full)
        if: always()
        shell: bash
        run: |
          echo "## Validation Full" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/routerbench_5shot.pkl ]; then
            echo "\n- RouterBench dataset: present" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "\n- RouterBench dataset: missing" >> "$GITHUB_STEP_SUMMARY"
          fi

  mutation-sharded:
    if: ${{ inputs.mutation_sharded == 'true' }}
    name: Mutation (sharded)
    uses: ./.github/workflows/mutation.yml
    with:
      cr_quick: true
      cr_gate: true
      cr_score_threshold: '1.0'
      target_files: ''
    secrets: inherit
