name: Matbench Online (guarded)

on:
  workflow_dispatch:
    inputs:
      enable:
        description: 'Run Matbench demo (advisory)'
        required: false
        default: 'true'
  schedule:
    - cron: '15 8 * * *'

permissions:
  contents: read

concurrency:
  group: matbench-online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matbench:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.enable == 'true' ||
      (github.event_name == 'schedule' && vars.ENABLE_MATBENCH_ONLINE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Calibrate lambda (demo)
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          python tools/calibrate_matbench_srmf.py \
            --path data/matbench_demo.csv \
            --objective-col y_true \
            --mode max \
            --topk-grid "1,3" \
            --lambda-grid "0.0,0.5,1.0" \
            --bootstrap 40 \
            --seed 0 \
            --out-json reports/matbench_calibration_online.json \
            --scores-out reports/matbench_scores_online.csv

      - name: Evaluate regret (held-out test split)
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          # Evaluate on the calibration step's --scores-out (held-out test rows,
          # already scored) instead of re-scoring the full CSV -- that would
          # re-include the rows used to select best_lambda.
          python tools/eval_matbench_regret.py \
            --path reports/matbench_scores_online.csv \
            --objective-col y_true \
            --mode max \
            --score-col score \
            --topk-grid "1,3" \
            --out-csv reports/matbench_regret_online.csv \
            --out-json reports/matbench_regret_online.json \
            --bootstrap 40 \
            --seed 0

      - name: Baseline regret (ridge)
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          python tools/eval_baseline_regret.py \
            --path data/matbench_demo.csv \
            --objective-col y_true \
            --mode max \
            --model ridge \
            --folds 3 \
            --topk-grid "1,3" \
            --bootstrap 40 \
            --seed 0 \
            --out-csv reports/matbench_baseline_regret_online.csv \
            --out-json reports/matbench_baseline_regret_online.json

      - name: Attestation
        run: |
          python tools/generate_matbench_attestation.py \
            --input-csv data/matbench_demo.csv \
            --calibration-json reports/matbench_calibration_online.json \
            --regret-json reports/matbench_regret_online.json \
            --out reports/matbench_attestation_online.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matbench-online
          path: |
            reports/matbench_*_online.*
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          echo "## Matbench Online (advisory)" >> "$GITHUB_STEP_SUMMARY"
          BEST=$(jq -r .best_lambda reports/matbench_calibration_online.json 2>/dev/null || echo "n/a")
          echo "- best_lambda: $BEST" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/matbench_regret_online.json ]; then
            REGRET=$(jq -r '.regret_mean // .regret' reports/matbench_regret_online.json 2>/dev/null || echo "n/a")
            echo "- regret_mean: $REGRET" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/matbench_baseline_regret_online.json ]; then
            BASE=$(jq -r '.regret_mean // .regret' reports/matbench_baseline_regret_online.json 2>/dev/null || echo "n/a")
            echo "- baseline_regret_mean: $BASE" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- artifacts: matbench-online" >> "$GITHUB_STEP_SUMMARY"
