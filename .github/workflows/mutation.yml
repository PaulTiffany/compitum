name: Mutation Reusable Shards

on:
  workflow_call:
    inputs:
      mutmut:
        required: false
        type: boolean
        default: true
      mutmut_gate:
        required: false
        type: boolean
        default: false
      cr_quick:
        required: false
        type: boolean
        default: false
      cr_full:
        required: false
        type: boolean
        default: false
      cr_gate:
        description: 'Enforce CR score threshold (fail job when below)'
        required: false
        type: boolean
        default: false
      cr_score_threshold:
        description: 'Minimum CR mutation score to pass (0.0-1.0)'
        required: false
        type: string
        default: '1.0'
      cr_timeout:
        description: 'CR per-mutant timeout seconds'
        required: false
        type: string
        default: '240'
      target_files:
        description: 'JSON array of filenames (e.g., ["metric.py"]) to shard mutmut over; fallback to full list if empty'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        file: ${{ inputs.target_files != '' && fromJSON(inputs.target_files) || fromJSON('["metric.py","constraints.py","router.py","predictors.py","control.py","energy.py","models.py","pgd.py","utils.py","symbolic.py","coherence.py","security.py","embedding_pgd.py","effort_qp.py","capabilities.py","boundary.py"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install mutmut
        run: |
          python -m pip install --upgrade pip
          pip install mutmut

      - name: Mutmut shard (${{ matrix.file }})
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          PYTEST_ADDOPTS: -q -m "not routerbench and not examples and not heavy_bench"
          HYPOTHESIS_PROFILE: mutation_ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -e
          mkdir -p reports
          TARGET_FILE="${{ matrix.file }}"
          TEST_PATHS="tests/router tests/metric tests/predictors tests/pgd"
          # Baseline with coverage to guide mutmut; do not enforce global threshold
          pytest -q --cov="src/compitum/${TARGET_FILE}" --cov-branch --cov-fail-under=0 $TEST_PATHS
          # Run mutmut restricted to this shard for speed and determinism
          mutmut run \
            --paths-to-mutate "src/compitum/${TARGET_FILE}" \
            --tests-dir tests \
            --use-coverage || true
          BASE="${TARGET_FILE%.py}"
          mutmut results | tee "reports/mutmut_results_${BASE}.txt"
          mutmut results --all | tee "reports/mutmut_results_${BASE}_full.txt" || true

      - name: Mutmut survivor details (${{ matrix.file }})
        if: always()
        run: |
          set -e
          TARGET_FILE="${{ matrix.file }}"; BASE="${TARGET_FILE%.py}"
          OUT="reports/mutmut_survivors_${BASE}.txt"
          echo "# Mutmut survivors for ${BASE}" > "$OUT" || true
          # Extract candidate IDs from results; show details if any
          BASE="$BASE" python -c "import subprocess, re, sys, os; base=os.environ.get('BASE',''); path=f'reports/mutmut_results_{base}.txt';\
txt=open(path,'r',encoding='utf-8',errors='ignore').read() if os.path.exists(path) else None;\
ids=re.findall(r'\\((\\d+)\\)', txt) if txt is not None else []; out=f'reports/mutmut_survivors_{base}.txt';\
f=open(out,'a',encoding='utf-8');\
[f.write('\n## survivor '+mid+'\n\n'+subprocess.check_output(['mutmut','show',mid], text=True, errors='ignore')+'\n') for mid in ids]; f.close()"
          echo "Wrote survivor details (if any) to $OUT"

      # Gating is handled in the caller (e.g., Full Validation); this shard always uploads reports

      - name: Upload artifacts (mutmut shard)
        uses: actions/upload-artifact@v4
        with:
          name: mutation-validation-mutmut-${{ matrix.file }}
          path: |
            reports/*.txt
          retention-days: 7

  cr-quick-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [
          metric,
          constraints,
          router,
          predictors,
          control,
          energy,
          models,
          pgd,
          utils,
          symbolic,
          coherence,
          security,
          embedding_pgd,
          effort_qp,
          capabilities,
          boundary
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Prepare CR config (${{ matrix.group }})
        env:
          HYPOTHESIS_PROFILE: mutation_ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          PYTEST_COVERAGE: 1
          CR_SCORE_THRESHOLD: ${{ inputs.cr_score_threshold }}
          CR_TIMEOUT: ${{ inputs.cr_timeout }}
          CR_GATE: ${{ inputs.cr_gate }}
        run: |
          set -e
          GROUP="${{ matrix.group }}"
          CFG="$RUNNER_TEMP/cr_${GROUP}.toml"
          printf '%s\n' \
            "[cosmic-ray]" \
            "module = \"compitum\"" \
            "module-path = \"src\"" \
            "test-command = \"bash scripts/cr_pytest.sh\"" \
            "timeout = 180.0" \
            "coverage-file = \".coverage\"" \
            "" \
            "excluded-modules = [" \
            "    \"tests/*\"," \
            "    \"**/__init__.py\"," \
            "    \"routerbench.*\"," \
            "    \"compitum.cli\"," \
            "    \"compitum.utils\"," \
            "    \"compitum.symbolic\"," \
            "    \"compitum.security\"," \
            "    \"compitum.pgd\"," \
            "    \"compitum.models\"," \
            "    \"compitum.embedding_pgd\"," \
            "    \"compitum.effort_qp\"," \
            "    \"compitum.coherence\"," \
            "    \"compitum.capabilities\"," \
            "    \"compitum.boundary\"," \
            "    \"compitum.control\"," \
            "    \"compitum.energy\"," \
            "]" \
            "" \
            "[cosmic-ray.distributor]" \
            "name = \"local\"" \
            > "$CFG"
          sed -i "s/^timeout = .*/timeout = ${CR_TIMEOUT}.0/" "$CFG" || true
          # Remove the target group from excluded-modules
          # (simple sed replace to allow mutating only that module)
          sed -i "s/\"compitum.${GROUP}\",//" "$CFG" || true
          echo "Using CR config:"; cat "$CFG"

          mkdir -p reports
          SESSION_DB="$RUNNER_TEMP/cr-${GROUP}-${{ github.run_id }}.sqlite"
          cosmic-ray init --force "$CFG" "$SESSION_DB"
          cosmic-ray exec "$CFG" "$SESSION_DB"
          cr-report "$SESSION_DB" > "reports/cr_quick_summary_${GROUP}.txt"
          cosmic-ray dump "$SESSION_DB" > "reports/cr_quick_dump_${GROUP}.jsonl"
          python tools/mutation_summary.py "reports/cr_quick_dump_${GROUP}.jsonl" "reports/cr_quick_summary_${GROUP}.json"
          GROUP="$GROUP" python -c "import json, sys, os; g=os.environ.get('GROUP',''); path=f'reports/cr_quick_summary_{g}.json';\
threshold=float(os.environ.get('CR_SCORE_THRESHOLD','1.0')); gate=os.environ.get('CR_GATE','false').lower()=='true';\
s=json.load(open(path,'r',encoding='utf-8')); score=float(s.get('mutation_score',0));\
print('Cosmic Ray (quick shard)', g, 'score:', score, 'threshold:', threshold, 'gate:', gate);\
sys.exit(0 if not gate or score>=threshold else 1)"

      - name: Upload artifacts (CR shard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-validation-cr-${{ matrix.group }}
          path: |
            reports/cr_quick_summary_${{ matrix.group }}.*
            reports/cr_quick_dump_${{ matrix.group }}.jsonl
          retention-days: 7




