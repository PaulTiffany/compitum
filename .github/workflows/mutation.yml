name: Mutation Reusable Shards

on:
  workflow_call:
    inputs:
      mutmut:
        required: false
        type: boolean
        default: true
      cr_quick:
        required: false
        type: boolean
        default: false
      cr_gate:
        description: 'Enforce CR score threshold (fail job when below)'
        required: false
        type: boolean
        default: false
      cr_score_threshold:
        description: 'Minimum CR mutation score to pass (0.0-1.0)'
        required: false
        type: string
        default: '1.0'
      cr_timeout:
        description: 'CR per-mutant timeout seconds'
        required: false
        type: string
        default: '240'
      target_files:
        description: 'JSON array of filenames (e.g., ["metric.py"]) to shard mutmut over; fallback to full list if empty'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut-shard:
    if: ${{ inputs.mutmut }}
    runs-on: ubuntu-latest
    # 30 min was too short for the largest targets: a real run (2026-07-20)
    # measured router.py/energy.py/metric.py/pgd.py all hitting this exact
    # timeout mid-sweep (job log shows "Terminate orphan process (mutmut)"),
    # while completed shards averaged ~3 mutants/min sustained -- router.py
    # (137 mutants) and energy.py (178 mutants) need ~45-65 min just by that
    # rate, before any per-run variance. 90 min gives real headroom.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        file: ${{ inputs.target_files != '' && fromJSON(inputs.target_files) || fromJSON('["metric.py","constraints.py","router.py","predictors.py","control.py","energy.py","models.py","pgd.py","utils.py","symbolic.py","coherence.py","security.py","embedding_pgd.py","effort_qp.py","capabilities.py","boundary.py","integrations/matbench_adapter.py","integrations/materials_project_audit.py","applications/fusion/diiid_adapter.py","applications/fusion/eval_offline.py"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install mutmut
        run: |
          python -m pip install --upgrade pip
          # Pin to 2.x: the commands below use the 2.x CLI (--paths-to-mutate,
          # --tests-dir, --use-coverage); mutmut 3.x rewrote the interface.
          pip install "mutmut<3"

      # mutmut caches each mutant's outcome in .mutmut-cache and skips
      # re-testing ones already known-killed for unchanged source, but that
      # cache starts empty on every fresh runner -- so every scheduled sweep
      # re-tests the entire shard from scratch even when nothing changed.
      # Restore it here, keyed on this shard's source file content plus the
      # full tests/ tree (any test change could flip a mutant's outcome, not
      # just tests for this specific file), so unrelated runs reuse prior
      # results instead of repeating hours of work.
      - name: Restore mutmut cache for this shard
        uses: actions/cache@v4
        with:
          path: .mutmut-cache
          key: mutmut-${{ matrix.file }}-${{ hashFiles(format('src/compitum/{0}', matrix.file)) }}-${{ hashFiles('tests/**') }}

      - name: Mutmut shard (${{ matrix.file }})
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          PYTEST_ADDOPTS: -q -m "not routerbench and not examples and not heavy_bench"
          HYPOTHESIS_PROFILE: mutation_ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -e
          mkdir -p reports
          TARGET_FILE="${{ matrix.file }}"
          # Baseline with coverage to guide mutmut; do not enforce global threshold.
          #
          # Two bugs fixed here, confirmed by direct reproduction:
          # 1. --cov wants a dotted module name (e.g. "compitum.metric"), not a
          #    bare file path -- "src/compitum/metric.py" silently produces "No
          #    data to report" (zero usable coverage), even though the tests
          #    pass and do exercise the file. Only 4 of the 17 shard targets'
          #    argument even looked plausible, and none of them actually worked.
          # 2. The old hardcoded TEST_PATHS ("tests/router tests/metric
          #    tests/predictors tests/pgd tests/applications") only overlaps
          #    the real test location for a handful of these 17 targets --
          #    most (e.g. boundary.py, constraints.py, control.py, energy.py,
          #    models.py, utils.py, symbolic.py, coherence.py, security.py,
          #    embedding_pgd.py, effort_qp.py, capabilities.py) are actually
          #    tested from top-level tests/test_<name>.py files or dedicated
          #    subdirectories this list never included, so their baseline
          #    coverage was always empty regardless of bug (1).
          # Combined effect: mutmut's --use-coverage skips anything absent from
          # coverage data, so most (likely all) of these 17 shards have been
          # silently mutating zero lines and reporting a hollow "pass" -- not a
          # gap only in this file's target, in the whole matrix. Fixed by using
          # the real dotted module name and running the full suite (default
          # testpaths from pyproject.toml already scoped by PYTEST_ADDOPTS's
          # marker filter above) so every shard sees genuine coverage of its
          # own target regardless of where that module's tests actually live.
          TARGET_MODULE="compitum.$(echo "${TARGET_FILE%.py}" | tr '/' '.')"
          # applications/fusion/* modules crash pytest-cov during collection
          # ("numpy: cannot load module more than once per process") when
          # --cov targets anything at or below compitum.applications.fusion --
          # reproduced across 3 environments, survives a full reboot, root-caused
          # to a coverage.py + nested-package interaction (see
          # reports/mutation_clean_verification_diiid_adapter.json). Targeting
          # the parent package instead works and still yields fully accurate
          # per-file coverage for every file inside the subpackage.
          case "${TARGET_FILE}" in
            applications/fusion/*) TARGET_MODULE="compitum.applications" ;;
          esac
          pytest -q --cov="${TARGET_MODULE}" --cov-branch --cov-fail-under=0
          # Run mutmut restricted to this shard for speed and determinism.
          # mutmut exits nonzero when survivors/timeouts/suspicious mutants exist, which is
          # the expected advisory outcome, not a failure -- but a genuine crash (bad args,
          # missing cache) looks the same via exit code alone, so verify the cache landed.
          set +e
          mutmut run \
            --paths-to-mutate "src/compitum/${TARGET_FILE}" \
            --tests-dir tests \
            --use-coverage
          MUTMUT_EXIT=$?
          set -e
          if [ ! -e .mutmut-cache ]; then
            echo "::error::mutmut run produced no cache (exit=${MUTMUT_EXIT}); treating as an infrastructure failure, not survivors"
            exit 1
          fi
          echo "mutmut run exit=${MUTMUT_EXIT} (nonzero commonly means survivors/timeouts; see reports for detail)"
          # Sanitize nested paths (e.g. integrations/matbench_adapter.py) into a flat basename
          # so report filenames never imply a reports/<subdir>/ that was never created.
          BASE="${TARGET_FILE%.py}"; BASE="${BASE//\//_}"
          mutmut results | tee "reports/mutmut_results_${BASE}.txt"

      - name: Mutmut survivor details (${{ matrix.file }})
        if: always()
        run: |
          set -e
          TARGET_FILE="${{ matrix.file }}"
          BASE="${TARGET_FILE%.py}"; BASE="${BASE//\//_}"
          echo "# Mutmut survivors for ${BASE}" > "reports/mutmut_survivors_${BASE}.txt"
          python tools/mutmut_survivor_details.py --base "$BASE"
          echo "Wrote survivor details (if any) to reports/mutmut_survivors_${BASE}.txt"
          # Sanitized basename, exported for the artifact-upload step below --
          # actions/upload-artifact rejects "/" in artifact names, which
          # matrix.file contains for nested-path targets (e.g.
          # integrations/matbench_adapter.py), failing the whole job on an
          # otherwise-successful mutation run.
          echo "BASE=${BASE}" >> "$GITHUB_ENV"

      # Gating is handled in the caller (e.g., Full Validation); this shard always uploads reports

      - name: Upload artifacts (mutmut shard)
        uses: actions/upload-artifact@v4
        with:
          name: mutation-validation-mutmut-${{ env.BASE }}
          path: |
            reports/*.txt
          retention-days: 7

  cr-quick-shard:
    if: ${{ inputs.cr_quick }}
    runs-on: ubuntu-latest
    # Raised from 60: even with coverage-scoped test selection (below), the
    # handful of "hub" modules (energy, metric, pgd, router, constraints)
    # that are transitively exercised by most of the invariants/pedagogy
    # suite only see a ~25-35% per-mutant speedup from file-level scoping
    # (measured locally: energy.py's scoped subset is 51 tests/52s vs the
    # full suite's 367 tests/71s) -- not enough on its own to guarantee
    # every file finishes within an hour. This is a simple backstop, not a
    # substitute for the scoping fix itself.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [
          metric,
          constraints,
          router,
          predictors,
          control,
          energy,
          models,
          pgd,
          utils,
          symbolic,
          coherence,
          security,
          embedding_pgd,
          effort_qp,
          capabilities,
          boundary,
          integrations.matbench_adapter,
          integrations.materials_project_audit,
          applications.fusion.diiid_adapter,
          applications.fusion.eval_offline
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Derive coverage-scoped test selection (${{ matrix.group }})
        env:
          HYPOTHESIS_PROFILE: mutation_ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -e
          GROUP="${{ matrix.group }}"
          TARGET="src/compitum/$(echo "${GROUP}" | tr '.' '/').py"
          # One-time, full-suite run with per-test coverage contexts -- NOT
          # repeated per-mutant. This is what lets every subsequent mutant
          # run scope down to only the test files that actually exercise
          # this shard's target module, instead of Cosmic Ray's default of
          # rerunning the entire suite for every single mutant (the root
          # cause of every cr-quick-shard timing out at the previous 60-min
          # cap, even for trivial single-mutant files like models.py). This
          # same .coverage file also feeds Cosmic Ray's own built-in
          # coverage-guided mutant skipping (the coverage-file config key
          # below), so it isn't a new cost on top of an existing one.
          pytest -q --cov=compitum --cov-branch --cov-context=test
          python scripts/derive_test_scope.py \
            --target "${TARGET}" \
            --out "$RUNNER_TEMP/cr_scope_${GROUP}.txt"
          echo "CR_TEST_SCOPE_FILE=$RUNNER_TEMP/cr_scope_${GROUP}.txt" >> "$GITHUB_ENV"

      - name: Prepare CR config (${{ matrix.group }})
        env:
          HYPOTHESIS_PROFILE: mutation_ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          CR_TIMEOUT: ${{ inputs.cr_timeout }}
        run: |
          set -e
          GROUP="${{ matrix.group }}"
          CFG="$RUNNER_TEMP/cr_${GROUP}.toml"
          printf '%s\n' \
            "[cosmic-ray]" \
            "module = \"compitum\"" \
            "module-path = \"src\"" \
            "test-command = \"bash scripts/cr_pytest.sh\"" \
            "timeout = 180.0" \
            "coverage-file = \".coverage\"" \
            "" \
            "excluded-modules = [" \
            "    \"tests/*\"," \
            "    \"**/__init__.py\"," \
            "    \"routerbench.*\"," \
            "    \"compitum.cli\"," \
            "    \"compitum.metric\"," \
            "    \"compitum.constraints\"," \
            "    \"compitum.router\"," \
            "    \"compitum.predictors\"," \
            "    \"compitum.utils\"," \
            "    \"compitum.symbolic\"," \
            "    \"compitum.security\"," \
            "    \"compitum.pgd\"," \
            "    \"compitum.models\"," \
            "    \"compitum.embedding_pgd\"," \
            "    \"compitum.effort_qp\"," \
            "    \"compitum.coherence\"," \
            "    \"compitum.capabilities\"," \
            "    \"compitum.boundary\"," \
            "    \"compitum.control\"," \
            "    \"compitum.energy\"," \
            "    \"compitum.integrations.matbench_adapter\"," \
            "    \"compitum.integrations.materials_project_audit\"," \
            "    \"compitum.applications.fusion.diiid_adapter\"," \
            "    \"compitum.applications.fusion.eval_offline\"," \
            "]" \
            "" \
            "[cosmic-ray.distributor]" \
            "name = \"local\"" \
            > "$CFG"
          sed -i "s/^timeout = .*/timeout = ${CR_TIMEOUT}.0/" "$CFG" || true
          # Remove the target group from excluded-modules so this shard mutates only that module
          sed -i "s/\"compitum.${GROUP}\",//" "$CFG" || true
          echo "Using CR config:"; cat "$CFG"

          mkdir -p reports
          SESSION_DB="$RUNNER_TEMP/cr-${GROUP}-${{ github.run_id }}.sqlite"
          cosmic-ray init --force "$CFG" "$SESSION_DB"
          # Prove the unmutated suite passes before spending time on mutants --
          # without this, a broken baseline (bad config, real test failure)
          # would just show up as every mutant "surviving," indistinguishable
          # from a genuine mutation-coverage gap.
          cosmic-ray baseline "$CFG"
          cosmic-ray exec "$CFG" "$SESSION_DB"
          cr-report "$SESSION_DB" > "reports/cr_quick_summary_${GROUP}.txt"
          cosmic-ray dump "$SESSION_DB" > "reports/cr_quick_dump_${GROUP}.jsonl"
          python tools/mutation_summary.py "reports/cr_quick_dump_${GROUP}.jsonl" "reports/cr_quick_summary_${GROUP}.json" --group "${GROUP}"

      - name: Gate on CR score (${{ matrix.group }})
        run: |
          set -e
          GATE_FLAG=""
          if [ "${{ inputs.cr_gate }}" = "true" ]; then GATE_FLAG="--gate"; fi
          python tools/cr_gate_check.py "reports/cr_quick_summary_${{ matrix.group }}.json" \
            --group "${{ matrix.group }}" \
            --threshold "${{ inputs.cr_score_threshold }}" \
            $GATE_FLAG

      - name: Upload artifacts (CR shard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-validation-cr-${{ matrix.group }}
          path: |
            reports/cr_quick_summary_${{ matrix.group }}.*
            reports/cr_quick_dump_${{ matrix.group }}.jsonl
          retention-days: 7
