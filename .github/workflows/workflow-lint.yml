name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          fail_level: any
          # Skip linting automated or templated workflows that don't pass strict YAML/shellcheck parsing
          actionlint_flags: "-shellcheck= -ignore '.github/workflows/mutation_dispatch.yml' -ignore '.github/workflows/mutation_on_label.yml'"

      - name: Report unpinned actions (advisory)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "## Unpinned Actions (advisory)" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          FOUND=0
          for f in .github/workflows/*.yml; do
            while IFS= read -r line; do
              if [[ "$line" =~ uses:\ (.+)@v[0-9]+ ]]; then
                echo "- $f: ${BASH_REMATCH[0]}" >> "$GITHUB_STEP_SUMMARY"
                FOUND=1
              fi
            done < "$f"
          done
          if [ $FOUND -eq 0 ]; then
            echo "All actions appear pinned to SHAs or non-v tags." >> "$GITHUB_STEP_SUMMARY"
          else
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Note: Pinning actions to commit SHAs is recommended for supply-chain security." >> "$GITHUB_STEP_SUMMARY"
          fi
