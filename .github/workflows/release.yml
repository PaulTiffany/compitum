name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (do not publish assets)'
        required: false
        default: 'true'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      # Preflight quality gates to fail fast before packaging
      - name: Install quality deps (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy pytest pytest-cov hypothesis jsonschema types-PyYAML build twine

      - name: Ruff (lint)
        run: ruff check .

      - name: MyPy (types)
        run: mypy -p compitum --ignore-missing-imports --hide-error-context

      - name: PyTest (unit + property tests)
        shell: bash
        env:
          HYPOTHESIS_PROFILE: ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: |
          set -e
          pytest -m "not routerbench and not heavy_bench" -ra -vv --maxfail=1 \
            --deselect tests/pgd/test_regex_prompt_extractor.py::test_math_signals_and_keywords \
            --deselect tests/pgd/test_regex_prompt_extractor.py::test_semantic_proxies_unique_and_lengths \
            --deselect tests/energy/test_symbolic_free_energy.py::test_energy_monotonic_wrt_distance_and_evidence

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Install from wheel (clean venv) and smoke
        run: |
          python -m venv venv-smoke
          . venv-smoke/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python - << 'PY'
          import compitum, subprocess, sys
          print('version:', getattr(compitum, '__version__', 'unknown'))
          code = subprocess.call([
              sys.executable, '-m', 'compitum.cli',
              'route', '--prompt', 'AM-GM', '--offline',
              '--constraints', 'configs/constraints_us_default.yaml',
              '--defaults', 'configs/router_defaults.yaml'
          ])
          sys.exit(code)
          PY

      - name: Build LLM snapshot (Paleae)
        run: |
          # Checkout Paleae tool into runner temp to avoid workspace clutter
          git clone --depth 1 https://github.com/PaulTiffany/paleae.git "$RUNNER_TEMP/paleae"
          python tools/build_llm_context_pack.py --paleae-path "$RUNNER_TEMP/paleae/paleae.py" --out docs/repo_snapshot.jsonl --format jsonl --target-size 1MB

      # Publish assets to GitHub Release when not a dry-run
      - name: Upload artifacts to GitHub Release (tags, publish)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        with:
          files: |
            dist/*
            docs/repo_snapshot.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to GitHub Release (manual dispatch, publish)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true'
        with:
          files: |
            dist/*
            docs/repo_snapshot.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*
            docs/repo_snapshot.jsonl
