name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      # Preflight quality gates to fail fast before packaging
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff (lint)
        run: ruff check .

      - name: MyPy (types)
        run: mypy -p compitum --ignore-missing-imports --hide-error-context

      - name: PyTest (unit + property tests)
        env:
          HYPOTHESIS_PROFILE: ci
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: >
          pytest -q -m "not routerbench" --deselect tests/pgd/test_regex_prompt_extractor.py::test_math_signals_and_keywords --deselect tests/pgd/test_regex_prompt_extractor.py::test_semantic_proxies_unique_and_lengths --deselect tests/energy/test_symbolic_free_energy.py::test_energy_monotonic_wrt_distance_and_evidence

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Record build environment
        run: |
          {
            echo "# Build Environment"
            echo
            echo "Python: $(python --version 2>&1)"
            echo "Pip: $(pip --version 2>&1)"
            echo
            echo "## Freeze"
            pip freeze
          } > build_env.txt

      - name: Install from wheel (clean venv) and smoke
        run: |
          python -m venv venv-smoke
          . venv-smoke/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python - << 'PY'
          import compitum, subprocess, sys
          print('version:', getattr(compitum, '__version__', 'unknown'))
          code = subprocess.call([
              sys.executable, '-m', 'compitum.cli',
              'route', '--prompt', 'AM-GM', '--offline',
              '--constraints', 'configs/constraints_us_default.yaml',
              '--defaults', 'configs/router_defaults.yaml'
          ])
          sys.exit(code)
          PY

      - name: Build LLM snapshot (Paleae)
        env:
          PALEAE_REF: ${{ vars.PALEAE_REF }}
        run: |
          # Checkout Paleae tool into runner temp to avoid workspace clutter
          set -euo pipefail
          REPO_URL="https://github.com/PaulTiffany/paleae.git"
          CLONE_DIR="$RUNNER_TEMP/paleae"
          if [ -n "${PALEAE_REF:-}" ]; then
            echo "Cloning Paleae at ref '${PALEAE_REF}' for determinism"
            git clone --depth 1 --branch "$PALEAE_REF" "$REPO_URL" "$CLONE_DIR" || {
              echo "Ref '${PALEAE_REF}' not found; falling back to default";
              git clone --depth 1 "$REPO_URL" "$CLONE_DIR";
            }
          else
            echo "PALEAE_REF not set; cloning default branch"
            git clone --depth 1 "$REPO_URL" "$CLONE_DIR"
          fi
          python tools/build_llm_context_pack.py --paleae-path "$CLONE_DIR/paleae.py" --out docs/repo_snapshot.jsonl --format jsonl --target-size 1MB

      - name: Generate release notes (dry-run)
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "Last tag: $LAST_TAG"
            RANGE="$LAST_TAG..HEAD"
          else
            echo "No prior tag found; using initial commit to HEAD"
            FIRST=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            RANGE="$FIRST..HEAD"
          fi
          {
            echo "# Release Notes (dry-run)"
            echo
            echo "Generated on: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Changes"
            git log --no-merges --pretty=format:'- %s (%h) by %an' $RANGE || true
            echo
            echo "## Stats"
            echo "Commits: $(git rev-list --count $RANGE)"
            echo "Contributors: $(git log --format='%aN' $RANGE | sort -u | wc -l | tr -d ' ')"
          } > release_notes.md
          echo "notes_path=release_notes.md" >> "$GITHUB_OUTPUT"
          echo "Created release_notes.md"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Release Dry-Run Summary"
            echo
            echo "- Wheel and sdist built and validated via Twine."
            echo "- Installed wheel in clean venv and executed CLI smoke."
            echo "- LLM snapshot generated with Paleae (ref: ${PALEAE_REF:-default})."
            echo "- Draft release notes generated (see artifact)."
          } >> "$GITHUB_STEP_SUMMARY"

      # DRY RUN: Commented out to avoid publishing during validation
      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
            docs/repo_snapshot.jsonl

      - name: Upload artifacts (Actions, dry-run)
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist/*
            docs/repo_snapshot.jsonl
            release_notes.md
            build_env.txt
          retention-days: 14
