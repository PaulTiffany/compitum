name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Install from wheel (clean venv) and smoke
        run: |
          python -m venv venv-smoke
          . venv-smoke/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python - << 'PY'
          import compitum, subprocess, sys
          print('version:', getattr(compitum, '__version__', 'unknown'))
          code = subprocess.call([
              sys.executable, '-m', 'compitum.cli',
              'route', '--prompt', 'AM-GM', '--offline',
              '--constraints', 'configs/constraints_us_default.yaml',
              '--defaults', 'configs/router_defaults.yaml'
          ])
          sys.exit(code)
          PY

      - name: Build LLM snapshot (Paleae)
        run: |
          # Checkout Paleae tool into runner temp to avoid workspace clutter
          git clone --depth 1 https://github.com/PaulTiffany/paleae.git "$RUNNER_TEMP/paleae"
          python tools/build_llm_context_pack.py --paleae-path "$RUNNER_TEMP/paleae/paleae.py" --out docs/repo_snapshot.jsonl --format jsonl --target-size 1MB

      # DRY RUN: Commented out to avoid publishing during validation
      # - name: Upload artifacts to GitHub Release
      #   uses: softprops/action-gh-release@v2
      #   if: startsWith(github.ref, 'refs/tags/')
      #   with:
      #     files: |
      #       dist/*
      #       docs/repo_snapshot.jsonl

      - name: Upload artifacts (Actions, dry-run)
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist/*
            docs/repo_snapshot.jsonl
