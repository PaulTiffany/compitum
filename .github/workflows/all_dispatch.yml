name: Orchestrate (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to run on (branch/tag)'
        required: false
        default: 'main'
      run_full:
        description: 'Also dispatch Full validation (heavy)'
        required: false
        default: 'false'
      run_mutation:
        description: 'Also dispatch Mutation dispatcher (sharded)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch CI
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN != '' && secrets.DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: '.github/workflows/ci.yml',
                ref: core.getInput('ref') || context.ref,
              });
              core.summary.addRaw('Dispatched CI').write();
            } catch (e) {
              core.warning(`CI dispatch failed: ${e?.message || e}`);
              core.summary.addRaw(`CI dispatch failed: ${e?.message || e}`).write();
            }

      - name: Dispatch Docs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN != '' && secrets.DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: '.github/workflows/docs.yml',
                ref: core.getInput('ref') || context.ref,
              });
              core.summary.addRaw('Dispatched Docs').write();
            } catch (e) {
              core.warning(`Docs dispatch failed: ${e?.message || e}`);
              core.summary.addRaw(`Docs dispatch failed: ${e?.message || e}`).write();
            }

      - name: Dispatch Release (dry-run)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN != '' && secrets.DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: '.github/workflows/release.yml',
                ref: core.getInput('ref') || context.ref,
              });
              core.summary.addRaw('Dispatched Release (dry-run)').write();
            } catch (e) {
              core.warning(`Release dispatch failed: ${e?.message || e}`);
              core.summary.addRaw(`Release dispatch failed: ${e?.message || e}`).write();
            }

      - name: Optionally dispatch Full validation
        if: inputs.run_full == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN != '' && secrets.DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: '.github/workflows/full.yml',
                ref: core.getInput('ref') || context.ref,
                inputs: { mutation: 'true', mutmut: 'false', mutation_sharded: 'false' }
              });
              core.summary.addRaw('Dispatched Full validation').write();
            } catch (e) {
              core.warning(`Full dispatch failed: ${e?.message || e}`);
              core.summary.addRaw(`Full dispatch failed: ${e?.message || e}`).write();
            }

      - name: Optionally dispatch Mutation (sharded)
        if: inputs.run_mutation == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN != '' && secrets.DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: '.github/workflows/mutation_dispatch.yml',
                ref: core.getInput('ref') || context.ref,
              });
              core.summary.addRaw('Dispatched Mutation (sharded)').write();
            } catch (e) {
              core.warning(`Mutation dispatch failed: ${e?.message || e}`);
              core.summary.addRaw(`Mutation dispatch failed: ${e?.message || e}`).write();
            }
