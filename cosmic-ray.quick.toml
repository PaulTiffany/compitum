[cosmic-ray]
module = "compitum"
module-path = "src"
test-command = "bash scripts/cr_pytest.sh"
timeout = 180.0
coverage-file = ".coverage"

# Quick CI scope: focus on core logic modules
excluded-modules = [
    "tests/*",
    "**/__init__.py",
    "routerbench.*",
    # Exclude ancillary/non-core modules to reduce mutant count
    "compitum.cli",
    "compitum.utils",
    "compitum.symbolic",
    "compitum.security",
    "compitum.pgd",
    "compitum.models",
    "compitum.embedding_pgd",
    "compitum.effort_qp",
    "compitum.coherence",
    "compitum.capabilities",
    "compitum.boundary",
]

[cosmic-ray.distributor]
name = "local"

