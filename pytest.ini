[pytest]
addopts = -m "not routerbench and not examples and not heavy_bench"
testpaths = tests
markers =
    hypo_lifecycle: marks tests as part of the hypothesis lifecycle suite
    invariants: property-based and structural invariants
    lg: learning/geometry-focused invariants
    cl: explainability/determinism invariants
    sy: control/stability invariants
    stat: estimation/uncertainty invariants
    pedagogy: pedagogy/"control of error" behavior
    deep: longer-running profile for nightly builds
    examples: runnable examples (excluded by default)
    routerbench: RouterBench integration tests (optional)
    benchmark: performance micro/meso benchmarks (pytest-benchmark)
    heavy_bench: long-running performance diagnostics (opt-in)
python_functions = test_* benchmark_*
